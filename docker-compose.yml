version: '3.8'

services:
  # -------------------------------------------------------------
  # Qdrant Vector Engine - 662D Neural Embeddings Store
  # -------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: weavly-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # -------------------------------------------------------------
  # RabbitMQ - Event Streaming & User Profile Invalidation
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: weavly-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # -------------------------------------------------------------
  # Redis - Cache & Session Accelerator
  # -------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: weavly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  qdrant_storage:
  rabbitmq_data:
